plugins {
	id 'com.github.johnrengelman.shadow' version '8.1.1'
	id 'java'
}


defaultTasks 'build'


group = 'io.github.Shevchik'
version = '1.1.0'


import java.nio.file.Path
import java.nio.file.Files


Path projectDirectoryPath = projectDir.toPath().toAbsolutePath()


java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

sourceSets {
	main {
		java {
			srcDirs = ['src']
		}
		resources {
			srcDirs = ['resources']
		}
	}
}

repositories {
	mavenCentral()
	maven {
		url = 'https://oss.sonatype.org/content/repositories/snapshots/'
	}
	maven {
		url = 'https://hub.spigotmc.org/nexus/content/repositories/public/'
	}
	maven {
		url = 'https://jitpack.io'
	}
}

dependencies {
	compileOnly group: 'org.spigotmc', name: 'spigot-api', version: '1.15.2-R0.1-SNAPSHOT'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.incremental = true
	options.release = 8
}


shadowJar {
	from sourceSets.main.java.srcDirs
	from 'LICENSE'

	archiveFileName.set(jar.archiveFileName.get())

	minimize()
}


task copyFinalJarToTarget(type: DefaultTask) {doLast{
	Path targetJarDirectory = projectDirectoryPath.resolve("target")
	Files.createDirectories(targetJarDirectory)
	Files.copy(
		shadowJar.archiveFile.get().asFile.toPath().toAbsolutePath(),
		targetJarDirectory.resolve(shadowJar.archiveBaseName.get() + '.jar'),
		java.nio.file.StandardCopyOption.REPLACE_EXISTING
	)
}}


compileJava.dependsOn(clean)
jar.enabled = false
jar.finalizedBy(shadowJar)
shadowJar.finalizedBy(copyFinalJarToTarget)
